# `.github/CODEOWNERS`

```text
# DS Defense CODEOWNERS
#
# CODEOWNERS identifies review responsibility.
# It does NOT imply copyright ownership or original authorship.
#
# This file assumes the GitHub organization has a team named:
#
#   @ds-defense/core-maintainers
#
# If that team does not exist yet, either create it or replace the
# entries below with the GitHub username of the current repository
# maintainer.
#
# More specific rules should be added BELOW the general rules.
# In CODEOWNERS, later matching rules take precedence.


# ------------------------------------------------------------
# Repository-wide infrastructure
# ------------------------------------------------------------

/README.md                          @ds-defense/core-maintainers
/CONTRIBUTING.md                    @ds-defense/core-maintainers
/GOVERNANCE.md                      @ds-defense/core-maintainers
/SOURCES.md                         @ds-defense/core-maintainers

/.github/                           @ds-defense/core-maintainers
/templates/                         @ds-defense/core-maintainers
/docs/                              @ds-defense/core-maintainers
/rfcs/                              @ds-defense/core-maintainers


# ------------------------------------------------------------
# Catalog
# ------------------------------------------------------------
#
# Core maintainers are responsible for the catalog infrastructure.
# Individual catalog entries may later be assigned to project
# maintainers using more specific rules below.

/catalog/                           @ds-defense/core-maintainers


# ------------------------------------------------------------
# Contributions
# ------------------------------------------------------------
#
# Until a contribution has its own maintainer, repository maintainers
# provide the default review route.
#
# Add project-specific rules BELOW this rule whenever an appropriate
# maintainer is identified.

/contributions/                     @ds-defense/core-maintainers


# ------------------------------------------------------------
# Project-specific ownership
# ------------------------------------------------------------
#
# Examples:
#
# /catalog/example-project/              @example-maintainer
# /contributions/example-project/        @example-maintainer
#
# Multiple maintainers are allowed:
#
# /contributions/example-project/        @alice @bob
#
# Organization teams may also be used:
#
# /contributions/example-project/        @ds-defense/example-project-maintainers
#
# Add real project ownership rules below this line.
```
